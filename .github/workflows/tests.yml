name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: storebot
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: storebot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://storebot:test-only-password@127.0.0.1:5432/storebot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -c "import discord, aiohttp, payos, qrcode, psycopg, dotenv"
      - name: Create Supabase-style roles for schema bootstrap
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['TEST_DATABASE_URL']) as db:
              db.execute('CREATE ROLE anon; CREATE ROLE authenticated;')
          PY
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q bot.py plan.py store.py store_db.py postgres_db.py payments.py tests
