services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PAYMENT_HOST: 0.0.0.0
    volumes:
      - bot_logs:/app/logs
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  bot_logs:
